name: Parse Cause List

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-parser]

jobs:
  parse:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'trigger-parser')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Cause List Parser
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/cause_list_parser.py

      # --- ADDED LOG UPLOAD ---
      - name: Upload Parser Logs
        if: always() # Ensures logs are uploaded even if the script crashes or halts
        uses: actions/upload-artifact@v4
        with:
          name: parser-audit-${{ github.run_number }}
          path: |
            app.log
            cleaned_text.txt
          retention-days: 7
